name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^tests/fixtures/'))"

      - name: Module tidy
        run: go mod tidy -diff

      - name: Test
        run: go test -race ./...

      - name: Test in a non-UTC timezone
        run: TZ=America/Los_Angeles go test ./...
